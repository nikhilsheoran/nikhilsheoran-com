<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a1410"/>
      <stop offset="1" stop-color="#1c0706"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff3b1f"/>
      <stop offset="0.55" stop-color="#ff9a1f"/>
      <stop offset="1" stop-color="#ffe27a"/>
    </linearGradient>
  </defs>
  <rect x="38" y="38" width="436" height="436" rx="100" fill="url(#bg)"/>
  <rect x="38" y="38" width="436" height="436" rx="100" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="4"/>
  <!-- A blocky pixel skull, drawn on a 16-unit grid. -->
  <g fill="url(#fire)" shape-rendering="crispEdges">
    <rect x="160" y="128" width="192" height="32"/>
    <rect x="128" y="160" width="256" height="128"/>
    <rect x="160" y="288" width="192" height="32"/>
    <rect x="176" y="320" width="32" height="48"/>
    <rect x="240" y="320" width="32" height="48"/>
    <rect x="304" y="320" width="32" height="48"/>
  </g>
  <g fill="#1c0706" shape-rendering="crispEdges">
    <rect x="168" y="192" width="64" height="56"/>
    <rect x="280" y="192" width="64" height="56"/>
    <rect x="240" y="256" width="32" height="32"/>
  </g>
</svg>
